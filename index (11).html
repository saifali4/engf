<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار تنظيم وعمارة الحاسوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dce3;--acc:#0b7a62;--acc-d:#095f4c;--bad:#b3261e;--good:#0b7a62;--gold:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a22;--card:#17242e;--ink:#e8eef3;--mute:#93a3b1;--line:#2b3c49;--acc:#2fc4a0;--acc-d:#58d6b9;--bad:#ff8a80;--good:#2fc4a0;--gold:#e8b44f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:19px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input[type=text]:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button{font:inherit;cursor:pointer;border-radius:8px;border:1.5px solid var(--acc);background:var(--acc);color:#fff;padding:10px 20px;font-weight:500}
@media (prefers-color-scheme:dark){button{color:#06231c}}
button:hover{background:var(--acc-d);border-color:var(--acc-d)}
button.ghost{background:transparent;color:var(--acc)}
button.ghost:hover{background:var(--bg)}
button.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
button:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.hide{display:none!important}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.q{direction:ltr;text-align:left;font-size:19px;font-weight:500;margin:6px 0 16px}
.opt{direction:ltr;text-align:left;display:flex;gap:12px;width:100%;padding:12px 14px;margin:0 0 9px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:400}
.opt:hover{background:var(--bg);border-color:var(--acc)}
.opt b{min-width:22px;color:var(--mute)}
.opt.sel{border-color:var(--acc);background:var(--bg);box-shadow:inset 3px 0 0 var(--acc)}
.opt.ok{border-color:var(--good)}.opt.no{border-color:var(--bad)}
.score{font-size:54px;font-weight:700;line-height:1.1;margin:4px 0}
.score small{font-size:22px;color:var(--mute);font-weight:400}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:500;font-size:13px}
td.n{width:44px;font-weight:700}
tr.me{background:var(--bg)}tr.me td{font-weight:700}
.r1{color:var(--gold)}
.note{background:var(--bg);border:1px dashed var(--gold);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:16px}
.rev{direction:ltr;text-align:left;border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rev .t{font-weight:500}.rev .g{color:var(--good)}.rev .b{color:var(--bad)}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">

<div id="cfgNote" class="note hide">⚠ قاعدة البيانات المشتركة غير مفعّلة: النتائج تُحفظ في هذا المتصفح فقط ولن يراها بقية الطلاب. اضبط <code>FIREBASE_URL</code> في أعلى السكربت.</div>

<!-- بداية -->
<section id="vStart">
  <h1>اختبار تنظيم وعمارة الحاسوب</h1>
  <p class="sub">100 سؤال اختيار من متعدد. تقدر تنهي الاختبار في أي وقت، والنتيجة تُحسب على الأسئلة اللي جاوبتها.</p>
  <div class="card">
    <label for="name"><b>اسمك</b></label>
    <input id="name" type="text" maxlength="40" autocomplete="name" placeholder="اكتب اسمك الكامل">
    <div id="nameErr" class="err"></div>
    <div class="row" style="margin-top:8px"><button id="btnStart">ابدأ الاختبار</button></div>
  </div>
  <div class="card"><h2>أفضل 10 طلاب</h2><div id="lbStart">جاري التحميل…</div></div>
</section>

<!-- الاختبار -->
<section id="vQuiz" class="hide">
  <div class="meta"><span id="who"></span><span id="cnt"></span></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="card">
    <div class="q" id="qText"></div>
    <div id="opts"></div>
    <div class="row" style="margin-top:14px">
      <button class="ghost" id="btnPrev">السابق</button>
      <button class="ghost" id="btnNext">التالي</button>
      <span class="sp"></span>
      <button class="danger" id="btnFinish">إنهاء الاختبار</button>
    </div>
  </div>
  <div class="meta"><span id="answered"></span></div>
</section>

<!-- النتيجة -->
<section id="vResult" class="hide">
  <div class="card">
    <div id="rName" class="sub" style="margin:0"></div>
    <div class="score"><span id="rScore"></span> <small id="rOut"></small></div>
    <div id="rDetail" class="sub" style="margin:0"></div>
    <div id="rRank" style="margin-top:10px;font-weight:700"></div>
  </div>
  <div class="card">
    <div class="row"><h2 style="margin:0">لوحة الترتيب</h2><span class="sp"></span>
      <button class="ghost" id="btnAll">عرض كل الطلاب</button></div>
    <div id="lbResult" style="margin-top:10px"></div>
  </div>
  <div class="row">
    <button id="btnAgain">اختبار جديد</button>
    <button class="ghost" id="btnRev">مراجعة إجاباتي</button>
  </div>
  <div id="review" class="card hide" style="margin-top:16px"></div>
</section>

</div>
<script>

emory Buffer Register (MBR)"], "a": 2}, {"q": "The ALU performs which of the following types of operations?", "o": ["Only arithmetic operations", "Only logical operations", "Both arithmetic and logical operations", "Only data fetch operations"], "a": 2}, {"q": "Which component generates the control signals that coordinate the computer's operation?", "o": ["Arithmetic and Logic Unit (ALU)", "Main Memory", "Control Unit (CU)", "System Bus"], "a": 2}, {"q": "During a memory read operation, which register holds the data after it is fetched from memory?", "o": ["Memory Address Register (MAR)", "Program Counter (PC)", "Instruction Register (IR)", "Memory Buffer Register (MBR)"], "a": 3}, {"q": "The Memory Address Register (MAR) holds:", "o": ["The data to be written to memory", "The instruction being decoded", "The address of a memory location", "The result of an ALU operation"], "a": 2}, {"q": "What is the first step in the Fetch-Decode-Execute cycle?", "o": ["Decode the instruction", "Execute the instruction", "Fetch the instruction", "Increment the Program Counter"], "a": 2}, {"q": "The system bus is composed of three types of buses. They are:", "o": ["Data, Address, Control", "Input, Output, Processing", "Memory, CPU, I/O", "Primary, Secondary, Cache"], "a": 0}, {"q": "The bus that carries the memory address from the CPU is the:", "o": ["Data Bus", "Address Bus", "Control Bus", "System Bus"], "a": 1}, {"q": "The width of the Address Bus determines the:", "o": ["Speed of the CPU", "Amount of data transferred at once", "Maximum addressable memory", "Number of I/O devices"], "a": 2}, {"q": "The bus that is bidirectional is the:", "o": ["Address Bus", "Data Bus", "Control Bus", "Both b and c"], "a": 3}, {"q": "A READ signal is sent from the CPU to memory via the:", "o": ["Data Bus", "Address Bus", "Control Bus", "System Clock"], "a": 2}, {"q": "Software that manages computer hardware and provides a platform for applications is:", "o": ["Application Software", "System Soft uction 0010 0011 0000 0101, the Opcode is:", "o": ["0010", "0011", "0000 0101", "The entire instruction"], "a": 0}, {"q": "The mnemonic AND R1, R2, R3 means:", "o": ["Add R2 and R3 and store in R1", "Subtract R3 from R2 and store in R1", "Perform bitwise AND on R2 and R3, store result in R1", "Perform bitwise OR on R2 and R3, store result in R1"], "a": 2}, {"q": "The mnemonic SUB R1, R2, R3 means:", "o": ["R1 = R2 + R3", "R1 = R2 AND R3", "R1 = R2 - R3", "R1 = R2 OR R3"], "a": 2}, {"q": "An instruction that changes the sequence of execution by modifying the Program Counter is a:", "o": ["Data Processing Instruction", "Logic Instruction", "Control Instruction (e.g., JUMP)", "I/O Instruction"], "a": 2}, {"q": "Which of the following is a logical operation?", "o": ["ADD", "SUB", "AND", "JUMP"], "a": 2}, {"q": "If R2 = 1010 and R3 = 1100, what is the result of AND R1, R2, R3?", "o": ["1110", "1000", "0110", "1010"], "a": 1}, {"q": "If R2 = 1010 and R3 = 1100, what is the result of OR R1, R2, R3?", "o": ["1110", "1000", "0110", "1010"], "a": 0}, {"q": "The Control Unit's operation is synchronized by the:", "o": ["ALU", "System Clock", "Data Bus", "Main Memory"], "a": 1}, {"q": "A Hardwired Control Unit is:", "o": ["Easy to modify", "Implemented with software", "Fast but inflexible", "Slow but flexible"], "a": 2}, {"q": "A Microprogrammed Control Unit uses a special memory called:", "o": ["Cache", "RAM", "Control Store", "Register File"], "a": 2}, {"q": "The binary code for instructions is stored in:", "o": ["The ALU", "The Control Unit", "Main Memory", "The System Bus"], "a": 2}, {"q": "The component that acts as an interface for data transfer between the CPU and an I/O device is the:", "o": ["MAR", "MDR", "I/O Module", "System Clock"], "a": 2}, {"q": "Which register in the CPU is used for communication with an I/O device?", "o": ["Program Counter (PC)", "Instruction Register (IR)", "I/O Buffer Register (I/OBR)", "Memory Address Register (MAR)"], "a": 2}, {"q": "The performance of a computer is largely determined by the speed of the:", "o": ["Printer", "Monitor", "CPU and Memory", "Keyboard"], "a": 2}, {"q": "The type of memory that loses its contents when power is turned off is:", "o": ["ROM", "RAM", "SSD", "Hard Disk"], "a": 1}, {"q": "A computer's main memory is typically made of:", "o": ["SRAM", "DRAM", "ROM", "Cache"], "a": 1}, {"q": "Cache memory is used to:", "o": ["Increase main memory capacity", "Store data permanently", "Speed up access to frequently used data by the CPU", "Connect to I/O devices"], "a": 2}, {"q": "In the Von Neumann architecture, the same bus is used to transfer:", "o": ["Only instructions", "Only data", "Both instructions and data", "Only addresses"], "a": 2}, {"q": "The Harvard Architecture is often used in:", "o": ["Desktop PCs", "Servers", "Microcontrollers and DSPs", "Laptops"], "a": 2}, {"q": "The ability to run multiple programs apparently simultaneously is called:", "o": ["Multiprocessing", "Multitasking", "Multithreading", "Multiprogramming"], "a": 1}, {"q": "The set of instructions that a CPU can execute is known as its:", "o": ["Computer Architecture", "Computer Organization", "Instruction Set Architecture (ISA)", "Control System"], "a": 2}, {"q": "Which of the following is a status flag set by the ALU?", "o": ["Opcode", "Operand", "Zero Flag (Z)", "Address"], "a": 2}, {"q": "The Zero Flag (Z) is set when the result of an operation is:", "o": ["Positive", "Negative", "Zero", "An overflow"], "a": 2}, {"q": "The Carry Flag (C) is useful after which type of operation?", "o": ["Logical AND", "Logical OR", "Arithmetic Addition/Subtraction", "Data Move"], "a": 2}, {"q": "The Overflow Flag (V) is used for:", "o": ["Unsigned arithmetic", "Logical operations", "Signed arithmetic", "Data transfer operations"], "a": 2}, {"q": "The step where the Control Unit figures out what the instruction means is called:", "o": ["Fetch", "Decode", "Execute", "Writeback"], "a": 1}, {"q": "The final step of an instructi const $ = id => document.getElementById(id);
const show = id => { ["vStart","vQuiz","vResult"].forEach(v => $(v).classList.toggle("hide", v !== id)); window.scrollTo(0,0); };
let state = {name:"", order:[], ans:{}, cur:0, t0:0, last:null, showAll:false};

/* ===== التخزين ===== */
async function loadResults(){
  if(!FIREBASE_URL){
    $("cfgNote").classList.remove("hide");
    try{ return JSON.parse(localStorage.getItem("quiz_results")||"[]"); }catch(e){ return []; }
  }
  const r = await fetch(`${FIREBASE_URL}/${TOTAL_NODE}.json`);
  if(!r.ok) throw new Error("load");
  const d = await r.json();
  return d ? Object.values(d) : [];
}
async function saveResult(res){
  if(!FIREBASE_URL){
    let a=[]; try{ a=JSON.parse(localStorage.getItem("quiz_results")||"[]"); }catch(e){}
    a.push(res); try{ localStorage.setItem("quiz_results", JSON.stringify(a)); }catch(e){}
    return;
  }
  const r = await fetch(`${FIREBASE_URL}/${TOTAL_NODE}.json`,{method:"POST",body:JSON.stringify(res)});
  if(!r.ok) throw new Error("save");
}

/* ===== الترتيب: أعلى درجات صحيحة، ثم أعلى نسبة، ثم أسرع وقت ===== */
function better(a,b){
  if(a.correct!==b.correct) return a.correct>b.correct;
  const pa=a.correct/a.answered, pb=b.correct/b.answered;
  if(pa!==pb) return pa>pb;
  return a.secs<b.secs;
}
function ranked(list){
  const best = new Map();
  list.forEach(r=>{ const k=r.name.trim().toLowerCase(); if(!best.has(k)||better(r,best.get(k))) best.set(k,r); });
  return [...best.values()].sort((a,b)=> better(a,b)?-1:1);
}
function renderBoard(el, list, opts={}){
  const rows = opts.all ? list : list.slice(0,10);
  if(!rows.length){ el.textContent="ما في نتائج للحين. كن أول واحد!"; return; }
  const t=document.createElement("table");
  t.innerHTML="<thead><tr><th>#</th><th>الاسم</th><th>الدرجة</th><th>النسبة</th></tr></thead>";
  const tb=document.createElement("tbody");
  rows.forEach((r,i)=>{
    const tr=document.createElement("tr");
    if(opts.me && r===opts.me) tr.className="me";
    const c=[i+1, r.name, `${r.correct} / ${r.answered}`, Math.round(r.correct/r.answered*100)+"%"];
    c.forEach((v,j)=>{ const td=document.createElement("td"); td.textContent=v; if(j===0){td.className="n"+(i===0?" r1":"");} tr.appendChild(td); });
    tb.appendChild(tr);
  });
  t.appendChild(tb); el.replaceChildren(t);
}
async function refreshStartBoard(){
  try{ renderBoard($("lbStart"), ranked(await loadResults())); }
  catch(e){ $("lbStart").textContent="تعذّر تحميل لوحة الترتيب."; }
}

/* ===== الاختبار ===== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function start(){
  const n=$("name").value.trim().replace(/\s+/g," ");
  if(n.length<2){ $("nameErr").textContent="اكتب اسمك (حرفين على الأقل)."; return; }
  $("nameErr").textContent="";
  state={name:n, order:shuffle(QS.map((_,i)=>i)), ans:{}, cur:0, t0:Date.now(), last:null, showAll:false};
  $("who").textContent=n; show("vQuiz"); draw();
}
function draw(){
  const i=state.order[state.cur], q=QS[i];
  $("qText").textContent=q.q;
  const box=$("opts"); box.replaceChildren();
  q.o.forEach((o,k)=>{
    const b=document.createElement("button");
    b.className="opt"+(state.ans[i]===k?" sel":"");
    const l=document.createElement("b"); l.textContent="ABCD"[k]+".";
    const s=document.createElement("span"); s.textContent=o;
    b.append(l,s);
    b.onclick=()=>{ state.ans[i]=k; draw(); };
    box.appendChild(b);
  });
  $("cnt").textContent=`سؤال ${state.cur+1} من ${QS.length}`;
  $("prog").style.width=((state.cur+1)/QS.length*100)+"%";
  $("answered").textContent=`أجبت على ${Object.keys(state.ans).length} سؤال`;
  $("btnPrev").disabled=state.cur===0;
  $("btnNext").disabled=state.cur===QS.length-1;
}
async function finish(){
  const answered=Object.keys(state.ans).length;
  if(!answered){ alert("جاوب على سؤال واحد على الأقل قبل إنهاء الاختبار."); return; }
  const msg = answered<QS.length
    ? `أجبت على ${answered} من ${QS.length} سؤال. تبي تنهي الاختبار؟ النتيجة تُحسب على ${answered} سؤال.`
    : "تبي تنهي الاختبار وتشوف النتيجة؟";
  if(!confirm(msg)) return;
  let correct=0; Object.entries(state.ans).forEach(([i,k])=>{ if(QS[i].a===k) correct++; });
  const res={name:state.name, correct, answered, secs:Math.round((Date.now()-state.t0)/1000), ts:Date.now()};
  state.last=res;
  $("rName").textContent=state.name;
  $("rScore").textContent=correct; $("rOut").textContent=`من ${answered}`;
  const pct=Math.round(correct/answered*100), m=Math.floor(res.secs/60), s=res.secs%60;
  $("rDetail").textContent=`النسبة ${pct}% · الوقت ${m}:${String(s).padStart(2,"0")}`;
  $("rRank").textContent="جاري حفظ النتيجة…";
  $("review").classList.add("hide");
  show("vResult");
  try{ await saveResult(res); }catch(e){ $("rRank").textContent="تعذّر حفظ النتيجة في لوحة الترتيب."; return; }
  showBoard();
}
async function showBoard(){
  try{
    const list=ranked(await loadResults());
    const me=list.find(r=>r.name.trim().toLowerCase()===state.name.toLowerCase());
    const pos=list.indexOf(me)+1;
    $("rRank").textContent=`ترتيبك: ${pos} من ${list.length} طالب`;
    renderBoard($("lbResult"), list, {all:state.showAll, me});
    $("btnAll").textContent=state.showAll?"عرض أفضل 10 فقط":"عرض كل الطلاب";
  }catch(e){ $("lbResult").textContent="تعذّر تحميل لوحة الترتيب."; }
}
function review(){
  const box=$("review"); box.replaceChildren();
  state.order.filter(i=>i in state.ans).forEach(i=>{
    const q=QS[i], ok=state.ans[i]===q.a, d=document.createElement("div"); d.className="rev";
    const t=document.createElement("div"); t.className="t"; t.textContent=q.q;
    const y=document.createElement("div"); y.className=ok?"g":"b"; y.textContent=`${ok?"✔":"✘"} ${q.o[state.ans[i]]}`;
    d.append(t,y);
    if(!ok){ const c=document.createElement("div"); c.className="g"; c.textContent=`✔ ${q.o[q.a]}`; d.appendChild(c); }
    box.appendChild(d);
  });
  box.classList.toggle("hide");
}

$("btnStart").onclick=start;
$("name").addEventListener("keydown",e=>{ if(e.key==="Enter") start(); });
$("btnPrev").onclick=()=>{ state.cur--; draw(); };
$("btnNext").onclick=()=>{ state.cur++; draw(); };
$("btnFinish").onclick=finish;
$("btnAll").onclick=()=>{ state.showAll=!state.showAll; showBoard(); };
$("btnRev").onclick=review;
$("btnAgain").onclick=()=>{ show("vStart"); refreshStartBoard(); };
refreshStartBoard();
</script>
</body>
</html>
