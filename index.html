<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار معمارية وتنظيم الحاسوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0b2545;--navy2:#13315c;--blue:#2563eb;--blue-soft:#eaf1ff;
    --bg:#f3f6fb;--card:#ffffff;--line:#e2e8f0;--txt:#0f172a;--mut:#64748b;
    --ok:#16a34a;--ok-bg:#e8f7ee;--bad:#dc2626;--bad-bg:#fdecec;--gold:#d99a00;
    --shadow:0 10px 30px rgba(11,37,69,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--txt);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}
  header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:26px 16px 70px;text-align:center}
  header h1{margin:0;font-size:1.55rem;font-weight:800;letter-spacing:.2px}
  header p{margin:6px 0 0;color:#b9c8e3;font-size:.95rem}
  .wrap{max-width:760px;margin:-46px auto 40px;padding:0 14px}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:26px;margin-bottom:18px;border:1px solid var(--line)}
  .hide{display:none!important}

  /* start */
  .field{display:block;margin-bottom:6px;color:var(--mut);font-weight:600;font-size:.92rem}
  input[type=text]{width:100%;padding:15px 16px;border-radius:12px;border:2px solid var(--line);background:#f8fafc;font:inherit;font-size:1.05rem;color:var(--txt);outline:none;transition:.2s}
  input[type=text]:focus{border-color:var(--blue);background:#fff}
  .btn{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 6px 16px rgba(37,99,235,.28)}
  .btn:hover{background:#1d4ed8;transform:translateY(-1px)}
  .info{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .chip{flex:1;min-width:120px;background:var(--blue-soft);color:var(--navy2);border-radius:12px;padding:12px;text-align:center;font-weight:700;font-size:.9rem}
  .chip b{display:block;font-size:1.3rem;color:var(--blue)}

  /* quiz */
  .qtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
  .qtop .who{color:var(--navy2)}
  .qtop .score{background:var(--blue-soft);color:var(--blue);padding:5px 14px;border-radius:999px;font-size:.9rem}
  .progress{height:8px;background:#e8eef7;border-radius:999px;overflow:hidden;margin-bottom:6px}
  .progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--blue),#60a5fa);border-radius:999px;transition:width .4s}
  .pcount{color:var(--mut);font-size:.85rem;margin-bottom:18px}
  .qbox{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
  .qbox .ar{color:var(--blue);font-weight:700;font-size:1.08rem;line-height:1.7;margin-bottom:8px}
  .qbox .en{direction:ltr;text-align:left;font-weight:600;font-size:1.05rem;line-height:1.6;color:var(--txt)}
  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:13px 14px;margin-top:10px;background:#fff;border:2px solid var(--line);border-radius:14px;font:inherit;color:var(--txt);cursor:pointer;transition:.18s}
  .opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft);transform:translateX(-2px)}
  .opt:disabled{cursor:default}
  .letter{flex:0 0 36px;height:36px;border-radius:10px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-family:Arial,sans-serif;direction:ltr}
  .otext{flex:1}
  .otext .oar{font-size:.93rem;color:var(--mut);margin-bottom:2px}
  .otext .oen{direction:ltr;text-align:left;font-weight:600}
  .mark{flex:0 0 24px;font-size:1.3rem;font-weight:800}
  .opt.correct{background:var(--ok-bg);border-color:var(--ok)}
  .opt.correct .letter{background:var(--ok);color:#fff}
  .opt.correct .mark{color:var(--ok)}
  .opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
  .opt.wrong .letter{background:var(--bad);color:#fff}
  .opt.wrong .mark{color:var(--bad)}
  .opt.dim{opacity:.55}

  /* result */
  .res{text-align:center}
  .res h2{margin:0 0 4px;font-size:1.3rem}
  .ring{position:relative;width:170px;height:170px;margin:16px auto}
  .ring svg{transform:rotate(-90deg)}
  .ring .num{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-weight:800;color:var(--navy)}
  .ring .num small{display:block;font-size:.85rem;color:var(--mut);font-weight:600;text-align:center}
  .praise{background:linear-gradient(135deg,#fff7d6,#ffeaa0);color:#7a5200;border:1px solid #f1d36a;border-radius:14px;padding:14px;font-size:1.3rem;font-weight:800;margin-top:6px}

  /* board */
  .bt{display:flex;align-items:center;gap:8px;margin:0 0 14px;font-size:1.2rem;font-weight:800;color:var(--navy)}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:8px;background:#f8fafc;border:1px solid var(--line)}
  .row .rk{flex:0 0 34px;text-align:center;font-weight:800;color:var(--mut)}
  .row .nm{flex:1;font-weight:700}
  .row .pt{font-weight:800;color:var(--navy2);direction:ltr}
  .row.perfect{background:linear-gradient(135deg,#fffbea,#fff3c4);border-color:#f1d36a}
  .row.perfect .pt{color:var(--gold)}
  .row.me{outline:2px solid var(--blue)}
  .empty{text-align:center;color:var(--mut);padding:14px}
  .note{color:var(--mut);font-size:.8rem;text-align:center;margin-top:10px}

  /* actions */
  .actions{display:flex;gap:10px;margin-top:18px}
  .ghost{flex:1;padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--navy2);font:inherit;font-weight:700;cursor:pointer;transition:.18s}
  .ghost:hover:not(:disabled){border-color:var(--blue);background:var(--blue-soft)}
  .ghost:disabled{opacity:.45;cursor:default}
  .ghost.danger{color:var(--bad)}
  .ghost.danger:hover:not(:disabled){border-color:var(--bad);background:var(--bad-bg)}
  .sub{color:var(--mut);font-weight:600;font-size:.92rem;margin:-4px 0 10px}
  .row .tg{font-size:.72rem;color:var(--mut);font-weight:600;margin-inline-start:6px}
  @media(max-width:480px){header h1{font-size:1.3rem}.card{padding:18px}}
</style>
</head>
<body>
<header>
  <h1>اختبار معمارية وتنظيم الحاسوب</h1>
  <p>Computer Organization &amp; Architecture</p>
</header>

<div class="wrap">

  <div id="start" class="card">
    <label class="field" for="name">اسم الطالب</label>
    <input id="name" type="text" placeholder="اكتب اسمك الثلاثي" maxlength="40" autocomplete="off">
    <div class="info">
      <div class="chip"><b>50</b>سؤال</div>
      <div class="chip"><b>MCQ</b>اختيار من متعدد</div>
      <div class="chip"><b>AR / EN</b>ترجمة عربية</div>
    </div>
    <button id="startBtn" class="btn">ابدأ الاختبار</button>
  </div>

  <div id="quiz" class="card hide">
    <div class="qtop"><span class="who" id="who"></span><span class="score" id="sc"></span></div>
    <div class="progress"><div id="bar"></div></div>
    <div class="pcount" id="prog"></div>
    <div class="qbox"><div class="ar" id="qar"></div><div class="en" id="qen"></div></div>
    <div id="opts"></div>
    <div class="actions">
      <button id="skipBtn" class="ghost">تخطّي السؤال ⏭</button>
      <button id="endBtn" class="ghost danger">إنهاء الاختبار 🏁</button>
    </div>
  </div>

  <div id="result" class="card res hide">
    <h2 id="rname"></h2>
    <div class="ring">
      <svg width="170" height="170" viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="74" fill="none" stroke="#e8eef7" stroke-width="14"/>
        <circle id="arc" cx="85" cy="85" r="74" fill="none" stroke="#2563eb" stroke-width="14" stroke-linecap="round" stroke-dasharray="465" stroke-dashoffset="465" style="transition:stroke-dashoffset 1s"/>
      </svg>
      <div class="num"><div id="rscore"></div></div>
    </div>
    <div class="sub" id="rsub"></div>
    <div class="praise hide" id="rmsg">🌟 رحم الله والديك 🌟</div>
    <button id="againBtn" class="btn">إعادة الاختبار</button>
  </div>

  <div id="board" class="card">
    <h3 class="bt">🏆 لوحة المتصدرين</h3>
    <div id="lb"></div>
    <div class="note" id="lbnote"></div>
  </div>

</div>

<script>
/* ===== إعدادات ===== */
const NEXT_DELAY = 2500;   // الانتقال التلقائي بعد الإجابة (ميلي ثانية)

/* ===== حالة الاختبار ===== */
const $ = id => document.getElementById(id);
let name = "", idx = 0, score = 0, locked = false, timer = null, done = false;
let attemptId = "", attemptNo = 1, startedAt = 0;
let ans = [];   // لكل سؤال: رقم الخيار | "s" (تخطي) | null (لم يُجب بعد)

/* ===== قاعدة البيانات (Firebase إذا موجود، وإلا localStorage) =====
   scores   : لوحة المتصدرين (محاولة منتهية)
   attempts : كل المحاولات + التقدم (الاسم، رقم المحاولة، الإجابات، الحالة) */
let dbErr = false;   // true إذا آخر عملية مع قاعدة البيانات فشلت
const base = () => FIREBASE_URL.replace(/\/$/, "");
async function dbAll(col){
  if (FIREBASE_URL){
    try{
      const r = await fetch(`${base()}/${col}.json`);
      if (!r.ok){ dbErr = true; return []; }
      return Object.values(await r.json() || {});
    }catch(e){ dbErr = true; return []; }
  }
  let out = [];
  try{ out = Object.values(JSON.parse(localStorage.getItem("mcq_" + col) || "{}")); }catch(e){}
  if (col === "scores"){ // نتائج النسخة القديمة
    try{ out = out.concat(JSON.parse(localStorage.getItem("mcq_board") || "[]")); }catch(e){}
  }
  return out;
}
async function dbPut(col, id, obj){
  if (FIREBASE_URL){
    try{
      const r = await fetch(`${base()}/${col}/${id}.json`, {method:"PUT", body: JSON.stringify(obj)});
      dbErr = !r.ok;
    }catch(e){ dbErr = true; }
    return;
  }
  try{
    const m = JSON.parse(localStorage.getItem("mcq_" + col) || "{}");
    m[id] = obj;
    localStorage.setItem("mcq_" + col, JSON.stringify(m));
  }catch(e){}
}

const norm = s => s.trim().replace(/\s+/g, " ").toLowerCase();
const enc = () => ans.map(v => v === null ? "-" : v === "s" ? "s" : String(v)).join("");
const answeredN = () => ans.filter(v => typeof v === "number").length;
const skippedN  = () => ans.filter(v => v === "s").length;

function record(status, early){
  return {id: attemptId, name, key: norm(name), no: attemptNo, status,
          score, answered: answeredN(), skipped: skippedN(), total: Q.length,
          a: enc(), early: !!early, start: startedAt, ts: Date.now()};
}
function saveProgress(){ dbPut("attempts", attemptId, record("in_progress", false)); }

function esc(s){ return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===== لوحة المتصدرين ===== */
async function renderBoard(me){
  let b = await dbAll("scores");
  b.sort((x,y) => y.score - x.score || x.ts - y.ts);   // الأعلى درجة، ثم الأسبق
  b = b.slice(0,50);
  $("lb").innerHTML = b.length ? b.map((e,i) =>
    `<div class="row ${e.score===Q.length?'perfect':''} ${me && e.id===me?'me':''}">
      <div class="rk">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
      <div class="nm">${esc(e.name)}${e.score===Q.length?' ⭐':''}${e.early?'<span class="tg">(أنهى مبكراً)</span>':''}</div>
      <div class="pt">${e.score} / ${Q.length}</div></div>`).join("")
    : `<div class="empty">لا توجد نتائج بعد</div>`;
  const ln = $("lbnote");
  if (!FIREBASE_URL){ ln.textContent = "ملاحظة: النتائج محفوظة على هذا الجهاز فقط."; ln.style.color = ""; }
  else if (dbErr){ ln.textContent = "⚠ تعذّر الاتصال بقاعدة البيانات — تأكد من Rules في Firebase"; ln.style.color = "var(--bad)"; }
  else { ln.textContent = "✓ متصل بقاعدة البيانات"; ln.style.color = "var(--ok)"; }
}

/* ===== سير الاختبار ===== */
async function startQuiz(){
  const n = $("name").value.trim().replace(/\s+/g, " ");
  if (!n){ $("name").focus(); $("name").style.borderColor = "var(--bad)"; return; }
  $("startBtn").disabled = true;
  const all = await dbAll("attempts");
  $("startBtn").disabled = false;

  const mine = all.filter(x => x && x.key === norm(n));
  const open = mine.filter(x => x.status === "in_progress" && x.a && x.a.length === Q.length)
                   .sort((p,q) => q.ts - p.ts)[0];
  name = n; done = false; clearTimeout(timer);

  if (open && confirm("عندك محاولة غير مكتملة بهذا الاسم.\nتريد تكمل منها؟\n(إلغاء = محاولة جديدة)")){
    attemptId = open.id; attemptNo = open.no; startedAt = open.start;
    ans = [...open.a].map(c => c === "-" ? null : c === "s" ? "s" : +c);
    score = ans.reduce((t,v,i) => t + (v === Q[i][2] ? 1 : 0), 0);
  } else {
    if (open) await dbPut("attempts", open.id, {...open, status: "abandoned", ts: Date.now()});
    attemptId = Date.now() + "-" + Math.random().toString(36).slice(2,7);
    attemptNo = mine.length + 1; startedAt = Date.now();
    ans = Q.map(() => null); score = 0;
    saveProgress();
  }
  idx = ans.indexOf(null);
  if (idx === -1){ finish(false); return; }

  $("start").classList.add("hide");
  $("result").classList.add("hide");
  $("board").classList.add("hide");
  $("quiz").classList.remove("hide");
  $("who").textContent = `👤 ${name} · محاولة ${attemptNo}`;
  showQ();
}

function showQ(){
  locked = false;
  $("skipBtn").disabled = false;
  const [q, opts] = Q[idx];
  const [qAr, optsAr] = AR[idx];
  $("prog").textContent = `السؤال ${idx+1} من ${Q.length}`;
  $("bar").style.width = (idx/Q.length*100) + "%";
  $("sc").textContent = `الدرجة: ${score}`;
  $("qar").textContent = qAr;
  $("qen").textContent = `${idx+1}. ${q}`;
  $("opts").innerHTML = "";
  opts.forEach((o,i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = `<span class="letter">${String.fromCharCode(65+i)}</span>
      <span class="otext"><div class="oar">${esc(optsAr[i])}</div><div class="oen">${esc(o)}</div></span>
      <span class="mark"></span>`;
    b.onclick = () => answer(i);
    $("opts").appendChild(b);
  });
}

function nextQ(){ idx++; idx < Q.length ? showQ() : finish(false); }

function answer(choice){
  if (locked || done) return;
  locked = true;
  $("skipBtn").disabled = true;
  const correct = Q[idx][2];
  const btns = $("opts").children;
  for (let i=0;i<btns.length;i++){
    btns[i].disabled = true;
    if (i!==correct && i!==choice) btns[i].classList.add("dim");
  }
  btns[correct].classList.add("correct");
  btns[correct].querySelector(".mark").textContent = "✓";
  ans[idx] = choice;
  if (choice === correct) score++;
  else { btns[choice].classList.add("wrong"); btns[choice].querySelector(".mark").textContent = "✗"; }
  $("sc").textContent = `الدرجة: ${score}`;
  $("bar").style.width = ((idx+1)/Q.length*100) + "%";
  saveProgress();
  timer = setTimeout(nextQ, NEXT_DELAY);
}

/* تخطّي السؤال: يروح للتالي بدون درجة */
function skip(){
  if (locked || done) return;
  ans[idx] = "s";
  saveProgress();
  nextQ();
}

/* إنهاء الاختبار قبل ما يخلص: تنحسب الدرجة على اللي أجاب عليه */
function endEarly(){
  if (done) return;
  const msg = `تريد تنهي الاختبار هسه؟\nأجبت على ${answeredN()} من ${Q.length} سؤال، ودرجتك ${score} / ${Q.length}.`;
  if (!confirm(msg)) return;
  finish(true);
}

async function finish(early){
  if (done) return;
  done = true; clearTimeout(timer);
  const r = record("finished", early);
  await dbPut("attempts", attemptId, r);
  await dbPut("scores", attemptId, {id: attemptId, name, score, answered: r.answered, total: Q.length,
                                    early: !!early, attempt: attemptNo, ts: r.ts});
  $("quiz").classList.add("hide");
  $("result").classList.remove("hide");
  $("board").classList.remove("hide");
  $("rname").textContent = name;
  $("rscore").innerHTML = `${score} / ${Q.length}<small>الدرجة النهائية</small>`;
  $("rsub").textContent = `أجبت على ${r.answered} من ${Q.length}` + (r.skipped ? ` · تخطّيت ${r.skipped}` : "") + (early ? " · أنهيت الاختبار مبكراً" : "");
  $("rmsg").classList.toggle("hide", score !== Q.length);
  setTimeout(() => { $("arc").style.strokeDashoffset = 465 - 465*score/Q.length; }, 50);
  await renderBoard(attemptId);
}

$("startBtn").onclick = startQuiz;
$("skipBtn").onclick = skip;
$("endBtn").onclick = endEarly;
$("name").addEventListener("keydown", e => { if (e.key === "Enter") startQuiz(); });
$("againBtn").onclick = () => {
  $("result").classList.add("hide");
  $("start").classList.remove("hide");
  $("name").value = "";
  $("arc").style.strokeDashoffset = 465;
};
renderBoard();
</script>
